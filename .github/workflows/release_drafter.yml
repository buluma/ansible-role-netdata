---
#
# Ansible managed
#

name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to default
    branches:
      - master
      - main
      - dependabot/**
      - renovate/**
      - testing
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
  # pull_request event is required only for autolabeler
  pull_request:
    # Only following types are handled by the action, but one can default to all as well
    types: [opened, reopened, synchronize]
  pull_request_target:

permissions: write-all

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7.7.0
        # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  changelog_draft:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dj-wasabi-release repo
        uses: actions/checkout@v7
        with:
          repository: dj-wasabi/dj-wasabi-release
          path: dj-wasabi-release
      - name: Checkout current repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: current-repo
      - name: Generate Changelog file
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd current-repo
          ../dj-wasabi-release/release.sh -d
      - name: Open changelog update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          path: current-repo
          add-paths: CHANGELOG.md
          branch: automation/changelog-draft
          commit-message: Update CHANGELOG.md
          title: Update CHANGELOG.md
          body: Generated release changelog update.

---
- name: install | Defining auto update CLI option.
  ansible.builtin.set_fact:
    auto_update_cli_option: "{{ netdata_auto_updates['enabled'] | ternary('--auto-update', '') }}"

- name: install | Cloning repository to {{ netdata_git_repo ~ ' -> ' ~ netdata_source_dir }}
  ansible.builtin.git:
    repo: "{{ netdata_git_repo }}"
    dest: "{{ netdata_source_dir }}"
    depth: 1
    version: "{{ netdata_git_version_tag }}"
  become: true

- name: install | Ensure GNU autotools are installed (RedHat family).
  ansible.builtin.package:
    name:
      - autoconf
      - automake
      - autoconf-archive
    state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"
  # netdata's own install-required-packages.sh silently skips these on
  # distro releases newer than the pinned netdata_git_version_tag knows
  # about (e.g. Fedora 43): its require_cmd/suitable_package detection
  # falls through without erroring or installing anything, so
  # netdata-installer.sh later aborts with "Could not find a usable
  # version of GNU autotools". Installing them ourselves sidesteps that
  # detection gap regardless of which distro releases netdata's script
  # does or doesn't recognize.

- name: install | Use netdata dependencies installation.
  ansible.builtin.command: "{{ netdata_requirements_installer }} {{ netdata_requirements_installer_options | join(' ') }}"
  args:
    chdir: "{{ netdata_source_dir }}"
  become: true
  register: netdata_requirements_install
  changed_when: >
    'All required packages are already installed. Now proceed to the next step.'
    not in netdata_requirements_install.stderr_lines
  tags:
    - molecule-idempotence-notest

- name: install | Running netdata installer from {{ netdata_installer ~ ' @ ' ~ netdata_source_dir }}
  ansible.builtin.command: "{{ installer_cli | join(' ') }}"
  vars:
    installer_cli:
      - "{{ netdata_installer }}"
      - "{{ auto_update_cli_option }}"
      - "--dont-wait"
  args:
    chdir: "{{ netdata_source_dir }}"
    creates: /usr/sbin/netdata
  become: true
  notify: Restart netdata
